<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090f1b">
  <title>Volabot AI — Deriv authorization</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:20px}
    .callback-card{max-width:520px;width:100%;background:#101a2a;border:1px solid #26364b;border-radius:14px;padding:30px}
    .callback-card h1{font:600 24px "Space Grotesk";margin:0 0 10px}
    .callback-card p{color:#9aa9bd;line-height:1.7;font-size:13px}
    .callback-card a{color:#26d69a}
    .callback-status{padding:13px;background:#17263a;border-radius:8px;color:#e5edf7;font-size:12px;line-height:1.6}
  </style>
</head>
<body>
  <main class="callback-card">
    <div class="brand-mark" style="margin-bottom:22px"><span></span><span></span><span></span></div>
    <h1>Volabot AI authorization</h1>
    <p id="status" class="callback-status">Checking authorization response…</p>
    <p><a href="../">Return to Volabot AI</a></p>
  </main>
  <script>
    const statusEl = document.getElementById("status");
    const params = new URLSearchParams(location.search);
    const code = params.get("code");
    const returnedState = params.get("state");
    const error = params.get("error");
    if (error) {
      statusEl.textContent = "Deriv authorization was not completed: " + error + ". Return to Volabot AI and try again.";
    } else if (!code) {
      statusEl.textContent = "No authorization code was received. Start the connection from the Volabot AI dashboard.";
    } else {
      const savedState = sessionStorage.getItem("pkce_state");
      const verifier = sessionStorage.getItem("pkce_verifier");
      if (!savedState || returnedState !== savedState || !verifier) {
        statusEl.textContent = "Authorization state could not be verified. Return to the dashboard and start a new login.";
      } else {
        // Deliberately do not exchange the code in browser JavaScript.
        // A server-side OAuth token exchange endpoint must be configured first.
        history.replaceState({}, document.title, location.pathname);
        statusEl.textContent = "Authorization response verified. The secure server-side token exchange is not configured yet, so your account is not connected. No token has been stored.";
      }
    }
  </script>
</body>
</html>
