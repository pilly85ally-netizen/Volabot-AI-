<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volabot AI</title>
</head>
<body>
  <h1>Welcome to Volabot AI</h1>
  <p id="status">Not logged in.</p>
  <button onclick="login()">Login with Deriv</button>
  <script>
    const APP_ID ="34LDVrHY1sipjLFU5vucF";
    const REDIRECT = "https://pilly85ally-netizen.github.io/Volabot-AI-/";
    function b64url(buf) {
      return btoa(String.fromCharCode(...new Uint8Array(buf)))
        .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }
    async function login() {
      const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
      const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
      const state = b64url(crypto.getRandomValues(new Uint8Array(16)));
      sessionStorage.setItem("pkce_verifier", verifier);
      sessionStorage.setItem("pkce_state", state);
      location.href = "https://auth.deriv.com/oauth2/auth?" + new URLSearchParams({
        response_type: "code", client_id:"34LDVrHY1sipjLFU5vucF"; redirect_uri: REDIRECT,
        code_challenge: challenge, code_challenge_method: "S256", state
      });
    }
    if (sessionStorage.getItem("deriv_token")) {
      document.getElementById("status").textContent = "Logged in successfully.";
    }
  </script>
</body>
</html>
