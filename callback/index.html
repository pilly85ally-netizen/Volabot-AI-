<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volabot AI - Deriv Callback</title>
</head>
<body>
  <h1>Volabot AI</h1>
  <p id="status">Checking authorization response...</p>
  <script>
    const APP_ID ="34LDVrHY1sipjLFU5vucF";
    const REDIRECT = "https://pilly85ally-netizen.github.io/Volabot-AI-/";
    const status = document.getElementById("status");
    const params = new URLSearchParams(location.search);
    (async () => {
      if (!params.has("code")) {
        status.textContent = "No authorization code received.";
        return;
      }
      if (params.get("state") !== sessionStorage.getItem("pkce_state")) {
        status.textContent = "State mismatch. Please login again.";
        return;
      }
      try {
        const res = await fetch("https://auth.deriv.com/oauth2/token", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({
            grant_type: "authorization_code",
            client_id:"34LDVrHY1sipjLFU5vucF",
            code: params.get("code"),
            code_verifier: sessionStorage.getItem("pkce_verifier"),
            redirect_uri: REDIRECT
          })
        });
        const data = await res.json();
        if (data.access_token) {
          sessionStorage.setItem("deriv_token", data.access_token);
          location.href = "../";
        } else {
          status.textContent = "Token error: " + JSON.stringify(data);
        }
      } catch (e) {
        status.textContent = "Request failed: " + e.message;
      }
    })();
  </script>
</body>
</html>
