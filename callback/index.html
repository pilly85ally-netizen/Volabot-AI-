
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volabot AI - Deriv Callback</title>
</head>
<body>
  <h1>Volabot AI</h1>
  <p id="status">Checking authorization response...</p>

  <script>
    const REDIRECT =
      "https://pilly85ally-netizen.github.io/Volabot-AI-/callback/";

    const statusEl = document.getElementById("status");
    const params = new URLSearchParams(location.search);

    async function handleCallback() {
      const code = params.get("code");
      const returnedState = params.get("state");
      const oauthError = params.get("error");

      if (oauthError) {
        statusEl.textContent =
          "Deriv authorization failed: " + oauthError;
        return;
      }

      if (!code) {
        statusEl.textContent =
          "No authorization code received. Start login from Volabot AI.";
        return;
      }

      const savedState = sessionStorage.getItem("pkce_state");
      const verifier = sessionStorage.getItem("pkce_verifier");

      if (!savedState || returnedState !== savedState) {
        statusEl.textContent =
          "State verification failed. Return to Volabot AI and start a new login.";
        return;
      }

      if (!verifier) {
        statusEl.textContent =
          "PKCE verifier is missing. Start a new login.";
        return;
      }

      // Do not exchange the same code twice in this browser tab.
      const handledKey = "handled_oauth_code";

      if (sessionStorage.getItem(handledKey) === code) {
        statusEl.textContent =
          "This authorization code has already been handled. Start a new login if needed.";
        return;
      }

      sessionStorage.setItem(handledKey, code);

      // Remove the authorization code from the visible URL.
      history.replaceState({}, document.title, REDIRECT);

      statusEl.textContent =
        "Authorization response verified. A secure backend is required to exchange the code for a token.";
    }

    handleCallback().catch(() => {
      statusEl.textContent =
        "An unexpected callback error occurred. Please start a new login.";
    });
  </script>
</body>
</html>
